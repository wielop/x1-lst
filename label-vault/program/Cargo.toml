[package]
name = "label-vault"
version = "0.1.0"
description = "Multi-LST restaking vault for X1 — deposit XNT, get a basket share token backed by multiple underlying stake-pool LSTs"
edition = "2021"

[features]
no-entrypoint = []

[dependencies]
arrayref = "0.3.7"
borsh = "0.10"
num-derive = "0.4"
num-traits = "0.2"
solana-program = "1.17.6"
spl-token = { version = "4.0", path = "../../token/program", features = [ "no-entrypoint" ] }
spl-associated-token-account = { version = "=2.2", path = "../../associated-token-account/program", features = [ "no-entrypoint" ] }
spl-stake-pool = { version = "1.0.0", path = "../../stake-pool/program", features = [ "no-entrypoint" ] }
thiserror = "1.0"

[lib]
crate-type = ["cdylib", "lib"]
